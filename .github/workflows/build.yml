name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Needed so ./gradlew can be executed directly.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # `set -o pipefail` is required: without it `./gradlew build | tee log`
      # reports tee's exit code (always 0), which hides a failing build AND
      # leaves no jar behind.
      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build-log.txt

      # GitHub requires admin rights to download job logs through the API,
      # so the log is published as an artifact instead.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elemental_verse-jar
          path: build/libs/elemental_verse-*.jar
          if-no-files-found: error
