name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 编译输出同时落一份到文件。理由：GitHub 的「下载任务日志」接口需要管理员权限，
      # 失败时拿不到错误正文；落成 artifact 之后任何人（包括自动化）都能读。
      - name: Build with Gradle
        run: ./gradlew build 2>&1 | tee build-log.txt

      # 只在失败时上传，避免把日志当产物发出去。
      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: warn

      # 成功时把 jar 发出来，方便不装环境直接丢进 mods 里试。
      # 注意 build 目录里还有 -sources 这类 jar，这里只挑主产物。
      - name: Upload mod jar (on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elemental_verse-jar
          path: build/libs/elemental_verse-*.jar
          if-no-files-found: error
