name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 编译输出同时落一份到文件。理由：GitHub 的「下载任务日志」接口需要管理员权限，
      # 失败时拿不到错误正文；落成 artifact 之后任何人（包括自动化）都能读。
      - name: Build with Gradle
        run: ./gradlew build 2>&1 | tee build-log.txt

      # 先把 build/ 里到底有什么打出来 —— jar 名字跟预想不一样时能立刻看见。
      - name: List build outputs
        if: always()
        run: |
          echo "=== build 顶层 ==="
          ls -la build || true
          echo "=== 所有 jar（任意深度）==="
          find build -name '*.jar' -type f 2>/dev/null | head -50 || true
          echo "=== build/libs ==="
          ls -la build/libs || true

      # 日志总是上传（包括成功时）。原因：GitHub 的「下载任务日志」接口需要管理员权限，
      # 而构建产物一旦失败就得能自证原因。日志体积很小，常开没负担。
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      # 成功时把 jar 发出来，方便不装环境直接丢进 mods 里试。
      # 用任意深度匹配：ModDevGradle 可能把产物放到 build/libs/<archivesName>/ 之类的位置。
      - name: Upload mod jar (on success)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elemental_verse-jar
          path: |
            build/libs/**/*.jar
            build/libs/*.jar
          if-no-files-found: warn
