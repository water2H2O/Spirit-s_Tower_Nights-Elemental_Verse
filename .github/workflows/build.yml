name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 先老老实实跑，不加管道 —— 之前 `| tee` 吞掉退出码，把失败伪装成成功。
      - name: Build with Gradle
        run: ./gradlew build --stacktrace --console=plain

      # 构建成功时把 jar 发出来，方便不装环境直接丢进 mods 里试。
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elemental_verse-jar
          path: build/libs/*.jar
          if-no-files-found: warn
